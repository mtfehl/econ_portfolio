project:
  type: website
  output-dir: docs
  resources:
    - images/
    - classes/R/*/images/
    - classes/STATA/*/images/
    - classes/R/*/docs/**
    - classes/STATA/*/docs/**
  render:
    # only render root-level files
    - "*.qmd"
    - "projects/**/*.qmd"
    
    # DON'T render anything in classes/ folders
    - "!classes/**/*.qmd"

website:
  title: "Michael Fehl"
  site-url: "https://mtfehl.github.io/econ_portfolio/"
  search: true  
  page-navigation: true
  back-to-top-navigation: true
  
  page-footer:
    right:
      - icon: github
        href: https://github.com/mtfehl
      - icon: linkedin
        href: https://linkedin.com/in/michael-t-fehl
      - icon: envelope
        href: "mailto:michaelthomasfehl@gmail.com"

  navbar:
