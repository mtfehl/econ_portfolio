      - text: "Home"
        href: index.qmd
      - text: "Portfolio"
        href: projects.qmd
      - text: "Classes"
        menu:
          - text: "Home"
            href: classes.qmd
          - text: "Geospatial"
            href: classes/R/geospatial/index.html
          - text: "Econometrics: Time Series"
            href: classes/R/finc_ecm/index.html
          - text: "Networks: Concepts & Algorithms"
            href: classes/R/networks/index.html
          - text: "Econometrics: Panel Data"
